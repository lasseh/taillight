# Mirrors .github/workflows/ci.yml — same lint, test, vulnerability-scan, DB
# integration and frontend gates. Keep the two files in sync.
#
# Not mirrored: release.yml (tag → binaries → release → image) and the Python
# SDK workflows. Those need GitLab-specific machinery (release-cli, package
# registry, kaniko/DinD) and are a separate piece of work.

stages:
  - test

variables:
  # GitLab only caches paths under $CI_PROJECT_DIR, so the Go caches move here.
  GOPATH: $CI_PROJECT_DIR/.go
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  # `go mod download` writes the module cache read-only, which then fails when
  # the cache archive is restored on the *second* pipeline. api/Makefile has
  # `GOFLAGS ?=` so this flows straight through.
  GOFLAGS: -modcacherw

# Deliberate deviation from GitHub: this repo is a push mirror where merge
# requests aren't used, so every branch push must run — a strict
# `pull_request`-style mirror would run nothing at all. The middle rule is
# GitLab's canonical guard against the branch pipeline and the MR pipeline
# both firing on one push, should anyone open an MR later.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

.go:
  # Debian-based on purpose: `make test` runs -race, which needs cgo and gcc.
  # golang:alpine has neither. api/go.mod declares go 1.26.6, so the toolchain
  # must be at least that — the same reason CI sets check-latest on GitHub.
  image: golang:latest
  cache:
    key:
      files:
        - api/go.sum
      # The three Go jobs run concurrently in one stage; without a per-job
      # prefix they share a cache key and clobber each other on upload.
      # _SLUG, not $CI_JOB_NAME — the job names contain a colon.
      prefix: $CI_JOB_NAME_SLUG
    paths:
      - .go/pkg/mod/
      - .cache/go-build/

lint:go:
  extends: .go
  before_script:
    # No tag argument installs the latest release, matching the GitHub
    # action's `version: latest`.
    - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin"
    - export PATH="$(go env GOPATH)/bin:$PATH"
    - cd api
  script:
    - make lint

test:go:
  extends: .go
  before_script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - export PATH="$(go env GOPATH)/bin:$PATH"
    - cd api
  script:
    - make test
    - make vulncheck

test:integration:
  extends: .go
  services:
    # Explicit alias — the default derived from the image name would be
    # `timescale-timescaledb`.
    - name: timescale/timescaledb:latest-pg18
      alias: timescaledb
  variables:
    POSTGRES_USER: taillight
    POSTGRES_PASSWORD: taillight
    POSTGRES_DB: taillight_test
    # Services are sibling containers reached by alias, not localhost as in the
    # GitHub workflow. TEST_DATABASE_URL also makes the Makefile target use this
    # database instead of starting its own container.
    TEST_DATABASE_URL: "postgres://taillight:taillight@timescaledb:5432/taillight_test?sslmode=disable"
  before_script:
    # GitLab has no --health-cmd; it only waits for the port to open.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client
    - for i in $(seq 1 60); do pg_isready -h timescaledb -U taillight -d taillight_test && break; sleep 1; done
    # The loop exits 0 even after 60 failures (the trailing sleep succeeds);
    # this re-check fails the job loudly instead of leaking a pgx connect error.
    - pg_isready -h timescaledb -U taillight -d taillight_test
    - cd api
  script:
    - make test-integration

test:frontend:
  image: node:22
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  before_script:
    - cd frontend
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run type-check
    - npx eslint . --quiet
    - npm run format:check
    - npm run test
    - npm run build
